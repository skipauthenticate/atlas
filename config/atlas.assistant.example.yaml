# Optional assistant runtime configuration.
# Atlas Voice uses conservative local-only defaults if this file is absent.
profiles:
  ambient:
    enabled: false
    source: mic
    mode: ambient
    stt_provider: hyprwhspr
    vad_provider: auto
    vad_fallback_provider: energy
    llm_profile: small-classifier
    tts_provider: none
    store_raw_audio_seconds: 30

  direct_voice:
    enabled: false
    realtime_backend: atlas-native
    stt_provider: whisperx
    llm_profile: qwen-voice
    tts_provider: faster-qwen3-tts
    tts_base_url: http://127.0.0.1:8008/v1/audio/speech
    tts_model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    tts_voice: Aiden
    require_tool_confirmation: true

  reflection:
    enabled: false
    asr_provider: whisperx
    diarization_provider: pyannote
    llm_profile: qwen-deep
    schedule: manual

llm_profiles:
  small-classifier:
    provider: openai-compatible
    model: qwen2.5-0.5b-instruct
    temperature: 0.0
    max_tokens: 256
    load_policy: hot_optional
    roles: [intent_classification, sensitivity_routing, low_stakes_routing]

  qwen-voice:
    provider: openai-compatible
    model: qwen2.5-7b-instruct
    temperature: 0.3
    max_tokens: 800
    load_policy: warm_optional
    roles: [fast_voice_replies, low_stakes_routing, brief_tool_planning]

  qwen-deep:
    provider: openai-compatible
    model: qwen-27b-instruct
    base_url: http://127.0.0.1:8080/v1/chat/completions
    temperature: 0.2
    max_tokens: 2400
    load_policy: on_demand
    roles: [deep_coaching, complex_reasoning, weekly_reviews, direct_questions]

privacy:
  local_only: true
  telemetry: false
  allowed_hosts: [127.0.0.1, localhost, llm]
  raw_audio_retention_seconds: 30
