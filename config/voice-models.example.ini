; llama.cpp router presets for the three Voice Studio profiles.
; Start from the repository root with:
; llama-server --models-preset config/voice-models.example.ini --models-max 1
;
; This file intentionally contains placeholders, not downloadable model coordinates.
; Operators must supply audited llama.cpp-compatible GGUF files under models/llm/voice,
; then record each filename, byte count, source revision, license, conversion command,
; quantizer, and SHA-256 in the deployment inventory. Never invent or reuse a hash.
; Relative model paths are resolved from llama-server's current working directory.

version=1

[*]
ctx-size = 16384
jinja = true
n-gpu-layers = all
flash-attn = on
kv-offload = true
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.5-2b]
; Candidate source: Qwen/Qwen3.5-2B
; Replace the placeholder filename and document its operator-supplied SHA-256.
model = models/llm/voice/atlas-light.OPERATOR-SUPPLIED.gguf
load-on-startup = false
stop-timeout = 30

[qwen3.5-9b]
; Candidate source: Qwen/Qwen3.5-9B (Qwen3.5-4B is the candidate fallback).
; Replace the placeholder filename and document its operator-supplied SHA-256.
model = models/llm/voice/atlas-torch.OPERATOR-SUPPLIED.gguf
load-on-startup = true
stop-timeout = 30

[qwen3.6-35b-a3b]
; Candidate source: Qwen/Qwen3.6-35B-A3B.
; The official Qwen3.6 repository documents llama.cpp support through GGUF artifacts.
; Replace this with a verified Qwen3.6 artifact and operator-supplied SHA-256.
model = models/llm/voice/atlas-fire.OPERATOR-SUPPLIED.gguf
load-on-startup = false
stop-timeout = 30
