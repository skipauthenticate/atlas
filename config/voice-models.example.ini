; llama.cpp router presets for the three Voice Studio profiles.
; Start from the repository root with:
; llama-server --models-preset config/voice-models.example.ini --models-max 1
;
; Immutable revisions, byte counts, licenses, and SHA-256 values live in
; benchmarks/voice_models_q8_inventory.json. Install and verify them with:
; python scripts/install-voice-models.py
; Relative model paths are resolved from llama-server's current working directory.


[*]
ctx-size = 16384
jinja = true
parallel = 1
n-gpu-layers = all
flash-attn = on
kv-offload = true
fit = off
cache-type-k = q8_0
cache-type-v = q8_0
reasoning = off
reasoning-budget = 0
chat-template-kwargs = {"enable_thinking": false}

[qwen3.5-2b]
; Community GGUF conversion of Qwen/Qwen3.5-2B; see pinned inventory.
model = models/llm/voice/Qwen_Qwen3.5-2B-Q8_0.gguf
load-on-startup = false
stop-timeout = 30

[qwen3.5-9b]
; Community GGUF conversion of Qwen/Qwen3.5-9B; see pinned inventory.
model = models/llm/voice/Qwen_Qwen3.5-9B-Q8_0.gguf
load-on-startup = true
stop-timeout = 30

[qwen3.6-35b-a3b]
; Official ggml-org GGUF conversion of Qwen/Qwen3.6-35B-A3B; see pinned inventory.
; Benchmark-only on the audited AGX Orin Q8 configuration: it filled the 2 GiB
; swap device and its routed load p95 was 176.436 seconds. Do not expose this
; profile to production voice traffic until a smaller quantization passes the
; switch, swap, timeout, and concurrent-TTS gates.
model = models/llm/voice/Qwen3.6-35B-A3B-Q8_0.gguf
load-on-startup = false
stop-timeout = 30
