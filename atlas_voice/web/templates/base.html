<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Atlas Voice{% endblock %}</title>
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-group">
        <a class="brand" href="/">Atlas Voice</a>
        <a class="topbar-link" href="/voice">Voice</a>
      </div>
      <div class="topbar-tools">
        {% if runtime is defined %}
          <div class="runtime-pill" title="{{ runtime.asr_provider }} · {{ runtime.asr_model }}">
            <strong>{{ runtime.accelerator }}</strong>
            <span>{{ runtime.asr_provider }} · {{ runtime.asr_model }}</span>
          </div>
        {% endif %}
        <form class="search" action="/search" method="get">
          <input name="q" type="search" value="{{ query | default('') }}" placeholder="Search transcripts">
          <button type="submit">Search</button>
        </form>
      </div>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
