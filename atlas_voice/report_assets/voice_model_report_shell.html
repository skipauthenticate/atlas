<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --surface: #ffffff;
      --bg: #f5f6f8;
      --surface-tertiary: #eef0f4;
      --text: #111318;
      --secondary: #5f6672;
      --muted: #858c98;
      --border: rgba(17, 19, 24, 0.10);
      --border-strong: rgba(17, 19, 24, 0.18);
      --grid: #e3e6eb;
      --blue: #1769e0;
      --purple: #7655d8;
      --warning: #b54708;
      --warning-bg: #fff2e8;
      --positive: #067647;
      --positive-bg: #ecfdf3;
      --ds-font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: clip; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--ds-font); }
    .shell { width: min(1160px, calc(100% - 32px)); margin: 20px auto 56px; overflow: hidden; border: 1px solid var(--border); border-radius: 24px; background: var(--surface); box-shadow: 0 18px 50px rgba(25, 31, 44, 0.08); }
    .topbar { display: flex; min-height: 52px; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; }
    .mark { width: 19px; height: 19px; border-radius: 7px; background: linear-gradient(145deg, var(--blue), var(--purple)); }
    .meta { max-width: 48%; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    main { padding: 48px; }
    .reading { width: min(820px, 100%); margin: 0 auto; }
    .wide { width: 100%; margin: 28px auto 44px; }
    .kicker { margin-bottom: 12px; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { max-width: 780px; margin: 0; font-size: 38px; font-weight: 560; letter-spacing: -1.8px; line-height: 1.1; }
    h2 { margin: 0 0 10px; font-size: 25px; font-weight: 600; letter-spacing: -.6px; line-height: 1.25; }
    h3 { margin: 0; font-size: 14px; font-weight: 650; }
    p, li { line-height: 1.65; }
    .deck { max-width: 760px; margin: 16px 0 30px; color: var(--secondary); font-size: 16px; }
    .summary { display: grid; grid-template-columns: 145px 1fr; gap: 24px; margin-bottom: 26px; padding: 24px 0; border-block: 1px solid var(--border-strong); }
    .summary-label { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .summary-body { display: grid; gap: 12px; }
    .summary-body p { margin: 0; color: var(--secondary); }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 46px; }
    .metric { min-height: 126px; padding: 16px 20px; border: 1px solid var(--border); border-radius: 20px; }
    .metric-label, .metric-note { color: var(--secondary); font-size: 12px; }
    .metric-value { margin: 8px 0 5px; font-size: 27px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .narrative { margin: 44px 0 20px; }
    .narrative p { max-width: 750px; margin: 0; color: var(--secondary); }
    .card { overflow: hidden; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); }
    figure.card { margin: 0; }
    .card-head { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); }
    .card-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .chart-wrap { overflow-x: auto; padding: 16px 22px; }
    [data-recharts-live] { display: none; }
    .chart-fallback svg { display: block; width: 100%; min-width: 680px; height: auto; }
    .chart-note { padding: 12px 20px 15px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
    .table-card { margin: 12px 0 46px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    th { color: var(--muted); font-weight: 650; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:last-child td { border-bottom: 0; }
    .caveat { margin: 46px 0 0; padding: 17px 19px; border-radius: 14px; background: var(--surface-tertiary); color: var(--secondary); }
    .source-tooltip { position: relative; display: inline-block; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: help; text-decoration: underline dotted; text-underline-offset: .18em; }
    .source-tooltip-content { position: absolute; z-index: 20; bottom: calc(100% + 8px); left: 50%; display: none; width: max-content; max-width: min(360px, 80vw); padding: 9px 11px; border-radius: 9px; background: #17191f; color: #fff; font-size: 12px; font-weight: 400; line-height: 1.45; text-align: left; white-space: normal; transform: translateX(-50%); box-shadow: 0 10px 30px rgba(0, 0, 0, .22); }
    .source-tooltip:hover .source-tooltip-content, .source-tooltip:focus .source-tooltip-content, .source-tooltip:focus-within .source-tooltip-content { display: block; }
    .source-tooltip-heading { display: none; }
    .source-figure { position: relative; }
    .source-figure > .source-tooltip { position: absolute; top: 11px; right: 12px; z-index: 2; padding: 4px 8px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--secondary); font-size: 11px; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #202228; --bg: #15171b; --surface-tertiary: #2c2f36; --text: #f6f7f9; --secondary: #c6cad2; --muted: #9ba1ad; --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.17); --grid: #373a42; --blue: #68a8ff; --warning: #ffad72; --warning-bg: #48230c; --positive: #75d6a2; --positive-bg: #123a28; }
    }
    @media (max-width: 800px) {
      .shell { width: 100%; margin: 0; border: 0; border-radius: 0; }
      main { padding: 32px 18px; }
      .metrics { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: 1fr; gap: 10px; }
    }
    @media (max-width: 520px) { h1 { font-size: 32px; } .metrics { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"></span>Data Analytics</div>
      <div class="meta">{{SOURCE_AND_DATE}}</div>
    </header>
    <main data-report-audience="{{REPORT_AUDIENCE}}"></main>
  </div>
  <!-- ATLAS_VOICE_MODEL_REPORT_RUNTIME -->
</body>
</html>
